name: CI

on:
  push:
  pull_request:

jobs:
  portable-circsym:
    name: CircSym physics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run portable CircSym physics suite
        run: >-
          python -m pytest
          tests/test_circsym.py
          tests/test_circsym_ib.py
          tests/test_circsym_cross_os_golden.py
          tests/test_native_coupled_ib_validation.py
          tests/test_sphere_grid_native.py
          -q
